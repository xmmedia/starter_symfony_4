security:
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        app_provider:
            id: App\Security\UserProvider

    # also in Pinia & \App\Model\User\Role
    role_hierarchy:
        ROLE_ADMIN:       ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    # https://symfony.com/doc/current/security.html#c-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        harsh:
            algorithm: auto
            cost:      15

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern:  ^/(_(profiler|wdt)|css|images|js|build)/
            security: false
        main:
            lazy:         true
            form_login:
                check_path:      app_login
                success_handler: App\Security\LoginSuccessHandler
                # CSRF validation is done in CsrfValidationSubscriber
            # https://symfony.com/doc/current/security/login_link.html
            login_link:
                check_route:     app_login_link
                # id and email will be used in the signature
                signature_properties: [ 'userId', 'email' ]
                # lifetime in seconds
                lifetime:        1800 # 30 minutes
                # maximum number of uses (within lifetime)
                max_uses:        3
                login_path:      app_login
                success_handler: App\Security\LoginSuccessHandler
            user_checker: App\Security\UserChecker
            logout:
                path: '/logout'
                # the available options are 'cache', 'cookies', 'storage', 'executionContexts'
                # you can also use the '*' wildcard to clear all data
                clear_site_data:
                    # cache not included because it slows down logout big time
                    # cookies not include because it removes cookies for all subdomains
                    - storage
                    - executionContexts

            remember_me:
                secret:   '%kernel.secret%'
                name:     'remember-me'
                lifetime: 2592000 # 30 days
                path:     /
                secure:   true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm:   auto
                cost:        4 # Lowest possible value for bcrypt
                time_cost:   3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
