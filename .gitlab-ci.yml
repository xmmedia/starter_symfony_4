default:
  image: xmmedia/php:8.5-cli
  timeout: 15m

stages:
  - static
  - deploy

# Select what we should cache
cache:
  # cache per job & branch
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - vendor/
    - node_modules/

variables:
  SERVER_PHP_PATH: php85
  APP_ENV: prod
  RELEASES: "$REMOTE_BASE/releases"
  SHARED: "$REMOTE_BASE/shared"
  MAINTENANCE:
    value: "0"
    description: >-
      1 to turn on maintenance mode while deploying, until the migrations have run
      (then it's turned off, even if it was on before)

before_script:
  # install composer
  - wget --no-verbose -O composer.phar https://getcomposer.org/composer-2.phar
  # install node with nvm
  - export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh" --no-use
  - nvm install
  # .yarnrc.yml widens supportedArchitectures for the Lando node container; narrow it back
  # to the runner's own platform (doesn't affect --immutable: the lockfile records them all)
  - yarn config set --json supportedArchitectures '{"os":["current"],"cpu":["current"],"libc":["current"]}'

.versions-script: &versions-script
  - php -v
  - php composer.phar --version
  - node --version
  - yarn --version

.security-checks: &security-checks
  # check for security issues in PHP libs
  - symfony security:check
  - php composer.phar audit
  # check for JS security issues in libs (cap timeout at 10s)
  - YARN_HTTP_TIMEOUT=10000 yarn audit:high

.deploy-setup-script: &deploy-setup-script
  - *versions-script
  # helpers for the rest of the job (its lines all run in one shell):
  # run a command on the server; run a console command in a release dir
  - remote () { ssh -p "$REMOTE_PORT" "$REMOTE_USER@$REMOTE_SERVER" "$@"; }
  - console () { dir=$1; shift; remote "cd $dir && $SERVER_PHP_PATH bin/console $*"; }
  # setup vars for paths
  - TIMESTAMP=$(date +%s); RELEASE="$RELEASES/$TIMESTAMP"
  - echo "Paths:"; echo $REMOTE_BASE; echo $RELEASE; echo $SHARED
  - echo "Remote:"; echo $REMOTE_USER@$REMOTE_SERVER:$REMOTE_PORT
  # setup SSH & private key
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
  - ssh-keyscan -p $REMOTE_PORT $REMOTE_SERVER >> ~/.ssh/known_hosts
  # the following line is optional (likely remove previous line)
  #- echo "$SSH_SERVER_HOSTKEYS" > ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  # add .revision file
  - git rev-parse --verify --short HEAD > .revision
  # create partial .env file
  - printf "APP_ENV=$APP_ENV\nREQUEST_CONTEXT_HOST=$REQUEST_CONTEXT_HOST\nREQUEST_CONTEXT_SCHEME=$REQUEST_CONTEXT_SCHEME\n" > .env.local && cat .env.local

.deploy-script: &deploy-script
  # remove temp .env file just in case
  - rm .env.local
  # ensure based paths exist
  - remote "mkdir -p $RELEASES $SHARED $SHARED/var $SHARED/var/log/archive $SHARED/public/uploads"
  # sync files to release directory
  - rsync --archive --stats --human-readable --no-perms --exclude ".git/" --exclude ".idea/" --exclude "node_modules/" -e "ssh -p $REMOTE_PORT" . $REMOTE_USER@$REMOTE_SERVER:$RELEASE
  # make console file executable
  - remote "chmod u+x $RELEASE/bin/console"
  # ensure platform has all requirements
  - remote "$SERVER_PHP_PATH -v; echo; cd $RELEASE && $SERVER_PHP_PATH composer.phar check-platform-reqs --no-dev"
  # link shared folders
  - remote "cd $RELEASE && rm -rf var public/uploads config/jwt && ln -s $SHARED/var var && ln -s $SHARED/public/uploads public/uploads && ln -s $SHARED/config/jwt config/jwt"
  # copy env file into place; dump env
  - remote "cp -a $SHARED/.env.local $RELEASE/.env.local && cd $RELEASE && $SERVER_PHP_PATH composer.phar dump-env"
  # run composer post update cmds on server
  - remote "cd $RELEASE && $SERVER_PHP_PATH composer.phar run-script post-update-cmd"
  # turn on maintenance mode until the migrations have run, when the job is run with MAINTENANCE=1.
  # Uses the new release, which shares var/. If the deploy fails part way, it's left on
  - |
    if [ "$MAINTENANCE" = "1" ]; then
      console $RELEASE app:maintenance on --no-interaction
    fi
  # switch to new version
  - remote "ln -sfn $RELEASE $REMOTE_BASE/current"
  # reload php-fpm (to reset cache)
  - remote "sudo /bin/systemctl reload php85-php-fpm"
  # stop/restart the doctrine message works/consumers & ensure the transports exist
  - |
    console $REMOTE_BASE/current messenger:stop-workers
    console $REMOTE_BASE/current messenger:setup-transports
  # run migrations
  - console $REMOTE_BASE/current doctrine:migrations:migrate --no-interaction --no-debug --allow-no-migration
  # turn off maintenance mode, if the deploy turned it on (even if it was already on)
  - |
    if [ "$MAINTENANCE" = "1" ]; then
      console $REMOTE_BASE/current app:maintenance off --no-interaction
    fi
  # remove >2 releases
  - remote "ls -1d $RELEASES/* | sort -rg | tail -n +3 | xargs /bin/rm -rf"
  # test if website is up. A 503 is fine when it's from maintenance mode (it sends X-Maintenance),
  # but only proves the app boots far enough to show the maintenance page
  - |
    URL="$REQUEST_CONTEXT_SCHEME://$REQUEST_CONTEXT_HOST"
    RESPONSE=$(wget --spider --server-response "$URL" 2>&1 || true)
    if echo "$RESPONSE" | grep -q '200 OK'; then
      echo "$URL is up"
    elif echo "$RESPONSE" | grep -q '503 Service Unavailable' && echo "$RESPONSE" | grep -qi 'X-Maintenance: 1'; then
      echo "$URL is in maintenance mode: deployed, but check the site once it's turned off"
    else
      echo "$URL is down"
      exit 1
    fi
  # success message
  - echo "Deployment completed successfully. Release at $RELEASE"

static:
  stage: static
  allow_failure: false
  interruptible: true
  variables:
    APP_ENV: test
  script:
    - *versions-script
    # install PHP dependencies
    - php composer.phar install --no-interaction --no-progress --ignore-platform-reqs
    # Install node/JS dependencies
    - yarn install --immutable
    # composer & yarn require packages to be installed before running security checks
    - *security-checks
    # make sure composer.lock is up to date
    - php composer.phar normalize --dry-run
    # cache warmup for phpstan
    - php bin/console cache:warmup --env=test
    - php bin/phpstan analyse --no-progress --memory-limit 1G src
    - bin/console lint:yaml config
    - bin/console lint:twig templates
    - bin/console lint:container
    # Symfony Language Tools; source-only so CI never boots the app
    - symfony lsp:check --source-only
    # lint JS
    - yarn lint:js
    - yarn lint:css
    # run PHP unit tests
    - mkdir -p public/build; printf "{}" > public/build/manifest.json
    - bin/phpunit
    # @todo artifacts

deploy to staging:
  stage: deploy
  allow_failure: false
  environment:
    name: staging
    url: $STAGING_URL
  variables:
    APP_ENV: staging
  when: manual
  script:
    - *deploy-setup-script
    # install PHP dependencies (not php dev dependencies)
    - php composer.phar install --no-dev --classmap-authoritative --no-interaction --no-progress --ignore-platform-reqs
    # Install node/JS dependencies
    - yarn install --immutable
    # composer & yarn require packages to be installed before running security checks
    - *security-checks
    # staging is the customer preview site, so build exactly what prod builds
    - yarn build
    - *deploy-script

deploy to prod:
  stage: deploy
  allow_failure: false
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
  environment:
    name: production
    url: $PROD_URL
  when: manual
  script:
    - *deploy-setup-script
    # install PHP dependencies (not php dev dependencies)
    - php composer.phar install --no-dev --classmap-authoritative --no-interaction --no-progress --ignore-platform-reqs
    # Install node/JS dependencies
    - yarn install --immutable
    # composer & yarn require packages to be installed before running security checks
    - *security-checks
    - yarn build
    - *deploy-script
