approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

enableTelemetry: false

nodeLinker: node-modules

# packages must be installed more than 10,080 minutes (7 days) ago to be considered for upgrade/install
# https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
npmMinimalAgeGate: 10080

# node_modules is on the Lando shared mount, so one install must serve both the host & the
# container: install the platform-specific binaries (@rolldown/binding-*, @parcel/watcher-*)
# for both. CI narrows this back to the runner's own platform
supportedArchitectures:
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.1.cjs
