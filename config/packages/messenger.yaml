framework:
    messenger:
        # The bus that is going to be injected when injecting MessageBusInterface:
        default_bus: messenger.bus.commands

        # Create buses
        buses:
            messenger.bus.commands:
                middleware:
                    - Xm\SymfonyBundle\Messenger\CommandEnricherMiddleware
                    - Xm\SymfonyBundle\Messenger\CommandRecorderMiddleware
                    - Xm\SymfonyBundle\Messenger\CausationRecorderMiddleware
                    - Xm\SymfonyBundle\Messenger\FailureCatcherMiddleware
            messenger.bus.events:
                default_middleware: 'allow_no_handlers'
                middleware:
                    - App\Messenger\RunProjectionMiddleware
                    - Xm\SymfonyBundle\Messenger\FailureCatcherMiddleware

        # failed messages are kept here for messenger:failed:show/retry/remove
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    delay:      30000 # 30 seconds
                    multiplier: 2 # double the delay each time
            failed:
                dsn:     '%env(MESSENGER_TRANSPORT_DSN)%'
                # an option: appending ?queue_name=failed to a DSN that already has a query string doesn't set it, so
                # failed messages would go back to the async queue. A queue_name in the DSN overrides it, so don't put
                # one there. queue_name is a Doctrine option: switching to another transport needs its own setting
                options: { queue_name: failed }
            # sync: 'sync://'

        routing:
            # Route your messages to the transports
            'App\Model\User\Command\SendPasswordChangedNotification': async
            'App\Model\User\Command\SendProfileUpdatedNotification':  async

