approvedGitRepositories: []

compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

enableTelemetry: false

nodeLinker: node-modules

# advisories with no fix available yet – remove once upstream releases a fix
# https://yarnpkg.com/configuration/yarnrc#npmAuditIgnoreAdvisories
npmAuditIgnoreAdvisories:
  # braces stack-exhaustion DoS: no fixed release (required by micromatch)
  - "1240992" # https://github.com/advisories/GHSA-vfj7-8cjw-p6xm

# packages must be installed more than 10,080 minutes (7 days) ago to be considered for upgrade/install
# https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
npmMinimalAgeGate: 10080

plugins:
  - checksum: c13ed363e15a826d9f779e7e7aca9dbee1d6d54813261d6f495da2fa94b01fa7579e516587ae2df5834f5d63d5d90cb392135190e8878b81dbd830c3c9f57809
    path: .yarn/plugins/@yarnpkg/plugin-outdated.cjs
    spec: "https://go.mskelton.dev/yarn-outdated/v4"

# node_modules is on the Lando shared mount, so one install must serve both the host & the
# container: install the platform-specific binaries (@rolldown/binding-*, @parcel/watcher-*)
# for both. CI narrows this back to the runner's own platform
supportedArchitectures:
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.1.cjs
