# run weekly by cron (added by bin/provision_site), from within the current release dir:
# /usr/sbin/logrotate config/packages/logrotate.conf --state var/logrotate-state

"var/log/*.log"
{
    compress
    weekly
    # only once it's over 5M
    minsize 5M
    # workers hold the file open, so copy & truncate it rather than moving it
    copytruncate
    missingok
    olddir archive
    # this is ~19 years
    rotate 1000
    dateext
    notifempty
}
