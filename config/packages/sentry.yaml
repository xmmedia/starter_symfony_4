when@prod: &prod
    sentry:
        dsn: '%env(SENTRY_DSN)%'
        # this hooks into critical paths of the framework (and vendors) to perform
        # automatic instrumentation (there might be some performance penalty)
        # https://docs.sentry.io/platforms/php/guides/symfony/performance/instrumentation/automatic-instrumentation/
        # tracing:
        #     enabled: true
        #     dbal: # DB queries
        #         enabled: true
        #     cache: # cache pools
        #         enabled: true
        #     twig: # templating engine
        #         enabled: true
        #     http_client: # Symfony HTTP client
        #         enabled: true

        # If you are using Monolog, you also need this additional configuration to log the errors correctly:
        # https://docs.sentry.io/platforms/php/guides/symfony/integrations/monolog/
        register_error_listener: false
        register_error_handler:  false
        options:
            # FatalError mustn't be ignored: with register_error_handler off, fatal errors
            # (eg out of memory) only reach Sentry through Monolog, as a FatalError
            ignore_exceptions:
                - Symfony\Component\HttpKernel\Exception\NotFoundHttpException
                - Symfony\Component\Security\Core\Exception\AccessDeniedException
                - Symfony\Component\Security\Core\Exception\InvalidCsrfTokenException
                # password reset related exceptions
                - SymfonyCasts\Bundle\ResetPassword\Exception\ExpiredResetPasswordTokenException
                - SymfonyCasts\Bundle\ResetPassword\Exception\InvalidResetPasswordTokenException
                - SymfonyCasts\Bundle\ResetPassword\Exception\TooManyPasswordRequestsException
            attach_stacktrace: true
            # replaces send_default_pii. The defaults send the user, IP, headers, query params &
            # request bodies (so the GraphQL query), but drop the Cookie header & filter values
            # whose names look sensitive (password, token, key, session, remember, etc.)
            # see https://docs.sentry.io/platforms/php/data-management/data-collected/ for more info
            data_collection:
                # their values are filtered anyway & the CSRF cookie's name is its token
                cookies:
                    mode: off
            # Enables Sentry's Logs product, which ships structured monolog records (see the
            # `sentry_logs` handler in monolog.yaml) to Sentry in addition to errors/exceptions.
            # Disabled by default since it adds continuous log volume beyond errors.
            enable_logs:       false

    # monolog integration in monolog.yaml

    services:
        Monolog\Processor\PsrLogMessageProcessor:
            tags: { name: monolog.processor, handler: sentry }

        Sentry\Monolog\Handler:
            arguments:
                $hub:              '@Sentry\State\HubInterface'
                $level:            !php/const Monolog\Logger::ERROR
                $fillExtraContext: true

        # Only needed if the `sentry_logs` handler in monolog.yaml is enabled.
        # Sentry\SentryBundle\Monolog\LogsHandler:
        #     arguments:
        #         $level: !php/const Monolog\Logger::INFO

when@staging: *prod
