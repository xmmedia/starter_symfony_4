# yaml-language-server: $schema=vendor/symfony/dependency-injection/Loader/schema/services.schema.json
# @todo-symfony update
# URL: https://symfonystarter.lndo.site
# DB URL: mysql://symfony:symfony@database:3306/symfony?serverVersion=8.4&charset=utf8mb4
# @todo-symfony update
name: symfonystarter
recipe: symfony
config:
  php: '8.5'
  # when changed, the .env.local also needs to be updated
  database: mysql:8.4
  webroot: public
  xdebug: true
  composer_version: 2
  config:
    database: lando_mysql.cnf
services:
  appserver:
    build_as_root:
      # LC_ALL: build steps inherit the host's locale vars, which the image doesn't have
      # (perl warns). LANG won't do — LC_CTYPE takes precedence over it
      - LC_ALL=C.UTF-8 a2enmod headers
      # proxy the Vite dev server at /vite-dev/ — see lando_apache_vite.conf
      - LC_ALL=C.UTF-8 a2enmod proxy proxy_http proxy_wstunnel proxy_balancer lbmethod_byrequests
      - ln -sf /app/lando_apache_vite.conf /etc/apache2/conf-enabled/vite.conf
      # to fix the "Xdebug: [Log Files] File '/tmp/xdebug.log' could not be opened." error
      - touch /tmp/xdebug.log && chmod 666 /tmp/xdebug.log
  phpmyadmin:
    type: phpmyadmin
    ssl: true
    sslExpose: false
    hosts:
      - database
  node:
    type: node:24
    ssl: true
    sslExpose: false
    # only `yarn preview` is published; the Vite port isn't, so a host-run `yarn dev`
    # isn't shadowed — the appserver proxies to it internally instead
    ports:
      # @todo-symfony change port number 2x (must match vite.config.mjs)
      - '9508:9508'
    build:
      - corepack enable
    overrides:
      environment:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
proxy:
  appserver:
    # @todo-symfony update
    - symfonystarter.lndo.site
  phpmyadmin:
    # @todo-symfony update
    - pma.symfonystarter.lndo.site
tooling:
  yarn:
    service: node
    description: Run a yarn command
  vite:
    service: node
    description: Install packages, then run the Vite dev server
    cmd:
      - yarn install
      - yarn dev
  vite-stop:
    service: node
    description: Stop the Vite dev server left running in the container
    cmd: pkill -f vite || true
  xdebug-on:
    service: appserver
    description: Enable xdebug for PHP
    cmd: "docker-php-ext-enable xdebug && /etc/init.d/apache2 reload"
    user: root
  xdebug-off:
    service: appserver
    description: Disable xdebug for PHP
    cmd: "rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && /etc/init.d/apache2 reload"
    user: root
