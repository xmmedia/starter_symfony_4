# Proxies the Vite dev server (the Lando `node` service) through the appserver, so dev
# assets are same-origin with the site. Local dev only; on staging/prod assets are
# served from /build/.
#
# Only /vite-dev/ is proxied — it must match `base` in vite.config.mjs.
<IfModule mod_proxy.c>
    ProxyRequests Off
    # pass the site's Host through — it must be in `allowedHosts` in vite.config.mjs
    ProxyPreserveHost On

    # the node service's certificate is issued by Lando for its own hostnames,
    # so it won't match the name we proxy to
    SSLProxyEngine On
    SSLProxyCheckPeerName Off
    SSLProxyCheckPeerCN Off

    # `lando vite` (the node container) is the normal case; a host-run `yarn dev` is the
    # hot standby, used only when the container isn't serving. Either way the browser
    # sees the same same-origin URL.
    #
    # Three things here are easy to get wrong:
    #   - upgrade/timeout are worker parameters: on a balancer they belong on the members,
    #     not on ProxyPass, which only takes balancer parameters (else Apache won't start)
    #   - retry must not be 0 — a worker retried immediately is never considered down, so
    #     the standby would never be reached
    #   - maxattempts retries the request on the standby instead of returning the 503
    #
    # Changing a BalancerMember needs a full Apache restart; the values live in shared
    # memory and a graceful reload silently keeps the old ones.
    <Proxy balancer://vitedev>
        # @todo-symfony change port number 2x (must match vite.config.mjs)
        BalancerMember https://node:9008 retry=1 upgrade=websocket timeout=600
        BalancerMember https://host.docker.internal:9008 retry=1 upgrade=websocket timeout=600 status=+H
    </Proxy>

    ProxyPass /vite-dev/ balancer://vitedev/vite-dev/ maxattempts=1
    ProxyPassReverse /vite-dev/ balancer://vitedev/vite-dev/
</IfModule>
