# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret:                '%env(APP_SECRET)%'
    #default_locale: en
    annotations:           false
    # stateless CSRF: validated with the origin & a double submitted cookie/header,
    # so the tokens don't expire with the session. See CsrfValidationSubscriber
    csrf_protection:
        stateless_token_ids: [ 'authenticate', 'graphql' ]
        check_header:        true
    http_method_override:  false
    handle_all_throwables: true
    # @todo-symfony uncomment if it's a private only site
    # don't allow indexing no matter the env
    #disallow_search_engine_index: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    # Note that the session will be started ONLY if you read or write from it.
    session:
        storage_factory_id: session.storage.factory.native
        save_path:          '%kernel.project_dir%/var/sessions'
        cookie_secure:      auto
        cookie_samesite:    lax
        # PHP's default gc_maxlifetime (24 min) collects idle sessions while their cookies
        # are still valid, signing out anyone without remember-me
        gc_maxlifetime:     604800 # 1 week
        gc_probability:     1
        gc_divisor:         100

    #esi: true
    #fragments: true

    validation: { enable_attributes: true }
    serializer: { enable_attributes: true }

when@dev:
    framework:
        trusted_proxies: '%env(TRUSTED_PROXIES)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
            name:               MOCKSESSID
