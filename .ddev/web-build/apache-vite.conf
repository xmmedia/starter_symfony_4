# Proxies the Vite dev server (`ddev yarn dev`, in this container) at /vite-dev/, so dev assets are
# same-origin with the site — browsers won't load an SVG <use> from another origin, even with CORS.
# Local dev only; on staging/prod assets are served from /build/. Copied into the image by the
# Dockerfile, so a change needs `ddev restart`.
#
# The path must match the dev `base` in vite.config.mjs. It must be server-level: ProxyPass is
# inherited by the vhosts, mod_rewrite directives aren't.
<IfModule mod_proxy.c>
    ProxyRequests Off
    # pass the site's Host through — it must be in `allowedHosts` in vite.config.mjs
    ProxyPreserveHost On

    # must match server.port in vite.config.mjs
    ProxyPass /vite-dev/ http://127.0.0.1:5173/vite-dev/ upgrade=websocket timeout=600
    ProxyPassReverse /vite-dev/ http://127.0.0.1:5173/vite-dev/
</IfModule>
